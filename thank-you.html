<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#0B1F44" name="theme-color"/>
<meta content="Submission confirmation — OCTA Group" name="description"/>
<meta content="Thank you — OCTA Group" property="og:title"/>
<title>OCTA Group | Thank you</title>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="styles.css" rel="stylesheet"/>
<style>
.confirmation-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 20px;
  background: #ffffff;
  text-align: center;
}

.confirmation-content {
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.confirmation-logo {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.confirmation-logo img {
  height: 60px;
  width: auto;
}

.confirmation-heading {
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1.3;
  color: #0b1f44;
  margin: 0;
  padding: 0 20px;
}

.confirmation-message {
  font-size: 1.1rem;
  line-height: 1.6;
  color: #49566a;
  margin: 0;
  padding: 0 20px;
}

.confirmation-highlight {
  color: #167957;
  font-weight: 600;
}

.confirmation-actions {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.confirmation-actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 32px;
  border-radius: 8px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s ease;
  border: none;
  cursor: pointer;
  font-size: 1rem;
}

.confirmation-actions a.button-home {
  background-color: #0b1f44;
  color: #ffffff;
}

.confirmation-actions a.button-home:hover {
  background-color: #0f2952;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(11, 31, 68, 0.2);
}

.confirmation-actions a.button-contact {
  background-color: transparent;
  color: #0b1f44;
  border: 2px solid #0b1f44;
}

.confirmation-actions a.button-contact:hover {
  background-color: #0b1f44;
  color: #ffffff;
  transform: translateY(-2px);
}

.confirmation-footer {
  font-size: 0.9rem;
  color: #49566a;
  margin-top: 30px;
  padding-top: 30px;
  border-top: 1px solid #d7dfe6;
}

.confirmation-footer a {
  color: #167957;
  text-decoration: none;
  font-weight: 600;
}

.confirmation-footer a:hover {
  text-decoration: underline;
}

@media (max-width: 640px) {
  .confirmation-container {
    padding: 30px 16px;
    min-height: auto;
  }

  .confirmation-heading {
    font-size: 1.8rem;
  }

  .confirmation-message {
    font-size: 1rem;
  }

  .confirmation-actions {
    flex-direction: column;
    gap: 12px;
  }

  .confirmation-actions a {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="confirmation-container">
  <div class="confirmation-content">
    <div class="confirmation-logo">
      <img alt="OCTA Group" src="logo.svg" height="60"/>
    </div>
    
    <h1 class="confirmation-heading">Thank you for your message</h1>
    
    <div class="confirmation-message">
      <p>Your request has been sent to <span class="confirmation-highlight">OCTA Group</span>.</p>
      <p>We will respond as soon as possible.</p>
    </div>
    
    <div class="confirmation-actions">
      <a href="https://ouattarachontchinwintanan-coder.github.io/octa-group/en.html" class="button-home">Back to home</a>
      <a href="https://ouattarachontchinwintanan-coder.github.io/octa-group/en.html#contact" class="button-contact">Contact us again</a>
    </div>
    
    <div class="confirmation-footer">
      <p>Business phone / WhatsApp: <a href="https://wa.me/2250173866818">+225 01 73 86 68 18</a></p>
      <p><a href="mailto:octagroup.contact@gmail.com">octagroup.contact@gmail.com</a></p>
    </div>
  </div>
</div>
</body>
</html>
