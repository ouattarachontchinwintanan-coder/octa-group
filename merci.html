<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F44">
  <title>Merci — OCTA Group</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0B1F44;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .logo {
      width: 150px;
      max-width: 60%;
      margin-bottom: 48px;
    }

    .card {
      background: #ffffff;
      color: #0B1F44;
      padding: 52px 36px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .check {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border: 2px solid #B89B5E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #B89B5E;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 2rem;
      line-height: 1.2;
    }

    p {
      margin: 0 auto 12px;
      max-width: 540px;
      line-height: 1.7;
      color: #49566a;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 26px;
      background: #0B1F44;
      color: #ffffff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .button:hover {
      opacity: 0.88;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.65);
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .logo {
        margin-bottom: 32px;
      }

      .card {
        padding: 40px 24px;
      }

      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <img
      class="logo"
      src="logo.svg"
      alt="OCTA Group"
    >

    <section class="card">

      <div class="check">✓</div>

      <h1>Merci pour votre demande.</h1>

      <p>
        OCTA Group a bien reçu votre message.
      </p>

      <p>
        Nous reviendrons vers vous prochainement.
      </p>

      <a class="button" href="/octa-group/">
        Retourner sur OCTA Group
      </a>

    </section>

    <div class="footer">
      Organisation of Capital, Trade and Assets.
    </div>

  </main>
</body>
</html>
